<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STILL — every photograph comes alive</title>
    <meta name="description" After the funeral, a family opens a shoebox of photographs. Each one comes alive — a memory you stand inside. />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="STILL" />
    <meta property="og:title" content="STILL — every photograph comes alive" />
    <meta property="og:description" content="After the funeral, a family opens a shoebox of photographs. Each one comes alive — a memory you stand inside." />
    <meta property="og:image" content="https://still.pras.fun/social.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="STILL — every photograph comes alive" />
    <meta name="twitter:description" content="After the funeral, a family opens a shoebox of photographs. Each one comes alive — a memory you stand inside." />
    <meta name="twitter:image" content="https://still.pras.fun/social.jpg" />
    <!-- Pre-React theme: stamp data-theme before first paint so a light-theme
         visit never flashes dark. Same precedence as the app (URL wins, then
         the persisted choice, then dark) and the same attribute applyTheme()
         writes — this script and applyTheme are the only two writers. -->
    <script>
      try {
        var m = location.search.match(/[?&]theme=(light|dark)\b/)
        var t = m ? m[1] : localStorage.getItem('alakazam-studio:theme:v1')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #000 }
      html[data-theme='light'], html[data-theme='light'] body, html[data-theme='light'] #root { background: #f4f6f9 }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
